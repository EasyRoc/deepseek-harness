# Example profile patch: copy to $DSH_HOME/profiles/web/cordis.patch.yml or pass
# with --patch. Does not modify the shipped dsh-base bundle.
#
# Desktop: merge into $DSH_HOME/profiles/desktop/cordis.patch.yml, then pnpm run dev:desktop
# Omit the llm-openai-compatible insert when the profile already registers
# provider "moldex" through llm-pi-ai settings.

- id: deepseek-account
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: product-analytics
  disabled: true

- insert:
  - id: llm-openai-compatible
    name: '@deepseek-ai/dsh-llm-openai-compatible'
    config:
      baseURL: https://api.moldex.top/v1
      provider: moldex
      displayName: Moldex
      apiKeyEnv: MOLDEX_API_KEY
      requireAccountSession: true
      streamUsage: false
      # Prefer an empty catalog so `/models` discovery keeps picker ids aligned with the gateway.
      models: []
  - id: moldex-account
    name: '@deepseek-ai/dsh-moldex-account'
    config:
      accountOrigin: https://www.moldex.top
      apiKeyEnv: MOLDEX_API_KEY

- id: agent-default-model
  config:
    provider: moldex
    model: glm-5.3-flash
